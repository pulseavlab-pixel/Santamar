<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SANTAMAR | COMING SOON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Montserrat:wght@300;400;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="coming-soon.css"/>
</head>
<body>
  <div class="background-image"></div>
  <div class="overlay"></div>
  <div class="cursor-glow"></div>
  

  
  <div class="secret-message" id="secretMessage">
    DONDE EL VERANO SE CONVIERTE EN HISTORIA
  </div>
  
  <div class="content">
    <div class="small-text">LA CUENTA ATRAS HA COMENZADO</div>
    <h1 class="main-title">COMING SOON</h1>
    <p class="subtitle">El verano no empieza… hasta que Santamar despierta</p>
    
    <div class="countdown" id="countdown">
      <div class="countdown-item">
        <span class="countdown-number" id="days">00</span>
        <span class="countdown-label">Días</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-number" id="hours">00</span>
        <span class="countdown-label">Horas</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-number" id="minutes">00</span>
        <span class="countdown-label">Minutos</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-number" id="seconds">00</span>
        <span class="countdown-label">Segundos</span>
      </div>
    </div>
    
    <button class="cta-button" id="ctaButton">
      <span class="btn-text">¿Te atreves?</span>
      <span class="btn-reveal" id="btnReveal">12 AGOSTO</span>
    </button>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="coming-soon.js"></script>
</body>
</html>
